<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jurnal Literasi — SDIT Muhammadiyah Harjamukti</title>
<meta name="description" content="Aplikasi Jurnal Literasi Siswa SDIT Muhammadiyah Harjamukti Kota Cirebon">
<link rel="icon" type="image/x-icon" href="/logo/favicon.ico">
<link rel="apple-touch-icon" href="/logo/icon-512.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/print.css" media="print">
</head>
<body>

<!-- ======================= HEADER ======================= -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="/logo/logo.png" alt="Logo Sekolah" class="brand-logo">
      <div class="brand-text">
        <strong>Jurnal Literasi</strong>
        <span>SDIT Muhammadiyah Harjamukti</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-admin-toggle" id="adminToggleBtn">🔐 <span id="adminToggleLabel">Login Kepsek</span></button>
      <div class="sync-indicator" id="syncIndicator">
        <span class="dot" id="syncDot"></span>
        <span id="syncLabel">Belum sinkron</span>
      </div>
    </div>
  </div>
</header>

<!-- ======================= NAV ======================= -->
<nav class="nav" id="mainNav">
  <button class="nav-item active" data-view="dashboard">🏠 <span>Beranda</span></button>
  <!-- menu sheet akan disisipkan lewat JS -->
  <button class="nav-item" data-view="daftar-siswa">🧑‍🎓 <span>Daftar Siswa</span></button>
  <button class="nav-item" data-view="settings">⚙️ <span>Pengaturan</span></button>
</nav>

<!-- ======================= MAIN CONTENT ======================= -->
<main id="app" class="app-content">
  <!-- konten dirender oleh app.js -->
</main>

<!-- ======================= TOAST ======================= -->
<div id="toast" class="toast"></div>

<!-- ======================= MODAL FORM ======================= -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Tambah Data</h3>
      <button id="modalClose" class="modal-close">&times;</button>
    </div>
    <form id="modalForm" class="modal-form"></form>
  </div>
</div>

<!-- ======================= MODAL LIHAT DETAIL TEKS ======================= -->
<div id="viewOverlay" class="modal-overlay hidden">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <h3 id="viewOverlayTitle">Detail</h3>
      <button id="viewOverlayClose" class="modal-close">&times;</button>
    </div>
    <div class="modal-form" id="viewOverlayContent" style="white-space:pre-wrap; line-height:1.6; color:var(--ink-900);"></div>
  </div>
</div>

<!-- ======================= MODAL LOGIN KEPSEK ======================= -->
<div id="adminLoginOverlay" class="modal-overlay hidden">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header">
      <h3>🔐 Login Kepsek</h3>
      <button id="adminLoginClose" class="modal-close">&times;</button>
    </div>
    <form id="adminLoginForm" class="modal-form">
      <div class="notice info" style="margin:0;">Masuk untuk melihat rekap data dari <strong>semua kelas</strong>.</div>
      <div class="field">
        <label>Kata Sandi</label>
        <input type="password" id="adminPasswordInput" placeholder="Masukkan kata sandi" autocomplete="off" required>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="adminLoginCancel">Batal</button>
        <button type="submit" class="btn btn-primary">Masuk</button>
      </div>
    </form>
  </div>
</div>

<!-- ======================= MODAL PRATINJAU PDF ======================= -->
<div id="pdfPreviewOverlay" class="pdf-preview-overlay hidden">
  <div class="pdf-preview-toolbar">
    <strong>👁️ Pratinjau Dokumen</strong>
    <div class="toolbar">
      <button class="btn" id="pdfPreviewClose">Tutup</button>
      <button class="btn btn-primary" id="pdfPreviewDownload">⬇️ Unduh PDF</button>
    </div>
  </div>
  <div class="pdf-preview-page" id="pdfPreviewContent"></div>
</div>

<!-- ======================= AREA CETAK (PDF / A4) ======================= -->
<div id="print-area"></div>

<script src="/js/config.js"></script>
<script src="/js/store.js"></script>
<script src="/js/gsheet.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
